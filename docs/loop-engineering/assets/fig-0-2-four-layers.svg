<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">FIG-0.2: Four layers: each one wraps the one before</title>
<desc id="d">Four nested boxes. Innermost: prompt engineering, the words of one request. Around it: context engineering, everything in the model's window for one request, a term that spread in 2025. Around that: harness engineering, the tools, permissions, and runtime around the model. Outermost: loop engineering, the repeating system that runs all of it, named in 2026.</desc>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="ah-body" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CC79A7"/></marker><marker id="ah-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56B4E9"/></marker></defs>
<rect x="6" y="6" width="1188" height="663" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="44.0" y="62.0" font-size="32" font-weight="700" fill="#0F172A" text-anchor="start">Four layers: each one wraps the one before</text>
<text x="1156.0" y="58.0" font-size="18" font-weight="600" fill="#64748B" text-anchor="end">FIG-0.2</text>
<rect x="60.0" y="116.0" width="1080.0" height="520.0" rx="20" fill="#F6E6EF" stroke="#CC79A7" stroke-width="3"/>
<text x="84.0" y="154.0" font-size="22" font-weight="800" fill="#9C3F76" text-anchor="start">LOOP ENGINEERING</text>
<text x="325.2" y="154.0" font-size="18" font-weight="400" fill="#334155" text-anchor="start">· the repeating system that runs it all · named 2026</text>
<text x="1116.0" y="186.0" font-size="17" font-weight="600" fill="#64748B" text-anchor="end">trigger · checker · state · stop rules · budgets</text>
<rect x="100.0" y="196.0" width="1000.0" height="420.0" rx="20" fill="#E4F3FC" stroke="#56B4E9" stroke-width="3"/>
<text x="124.0" y="234.0" font-size="22" font-weight="800" fill="#1B6FA0" text-anchor="start">HARNESS ENGINEERING</text>
<text x="407.8" y="234.0" font-size="18" font-weight="400" fill="#334155" text-anchor="start">· the machinery around the model</text>
<text x="1076.0" y="266.0" font-size="17" font-weight="600" fill="#64748B" text-anchor="end">tools · permissions · sandbox · runtime</text>
<rect x="140.0" y="276.0" width="920.0" height="320.0" rx="20" fill="#DDF3EC" stroke="#009E73" stroke-width="3"/>
<text x="164.0" y="314.0" font-size="22" font-weight="800" fill="#00795A" text-anchor="start">CONTEXT ENGINEERING</text>
<text x="447.8" y="314.0" font-size="18" font-weight="400" fill="#334155" text-anchor="start">· everything in the window for one request · 2025</text>
<text x="1036.0" y="346.0" font-size="17" font-weight="600" fill="#64748B" text-anchor="end">instructions · files · examples · history</text>
<rect x="180.0" y="356.0" width="840.0" height="220.0" rx="20" fill="#E1EEF8" stroke="#0072B2" stroke-width="3"/>
<text x="204.0" y="394.0" font-size="22" font-weight="800" fill="#005F94" text-anchor="start">PROMPT ENGINEERING</text>
<text x="473.6" y="394.0" font-size="18" font-weight="400" fill="#334155" text-anchor="start">· the words of one request</text>
<rect x="220.0" y="430.0" width="760.0" height="110.0" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="600.0" y="474.0" font-size="20" font-weight="400" fill="#0F172A" text-anchor="middle" font-style="italic">"Write a 100-word invitation to a six-week study on the</text>
<text x="600.0" y="504.0" font-size="20" font-weight="400" fill="#0F172A" text-anchor="middle" font-style="italic">Sermon on the Mount. Use {{DAY}}, {{TIME}}, {{PLACE}}."</text>
