<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">FIG-2.2: The checker ladder</title>
<desc id="d">Three rungs. Bottom: deterministic checks such as tests, type checks, linters, schema validation, word counts, and exact match against a source text; nearly free, strict, never drifts, but sees only what it was built to see. Middle: a model judge with an anchored rubric and separate instructions; judges meaning and tone but needs calibration and has biases such as favoring length. Top: a human; the final say on stakes and meaning, but slowest and most expensive, so used on samples and escalations. Advice: use the cheapest check you can trust, and stack them.</desc>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="ah-body" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CC79A7"/></marker><marker id="ah-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56B4E9"/></marker></defs>
<rect x="6" y="6" width="1188" height="663" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="44.0" y="62.0" font-size="32" font-weight="700" fill="#0F172A" text-anchor="start">The checker ladder</text>
<text x="44.0" y="96.0" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Use the cheapest check you can trust, then stack the rungs</text>
<text x="1156.0" y="58.0" font-size="18" font-weight="600" fill="#64748B" text-anchor="end">FIG-2.2</text>
<rect x="60.0" y="470.0" width="1080.0" height="142.0" rx="16" fill="#E1EEF8" stroke="#0072B2" stroke-width="3"/>
<text x="84.0" y="510.0" font-size="24" font-weight="800" fill="#005F94" text-anchor="start">1 · DETERMINISTIC</text>
<text x="1116.0" y="510.0" font-size="18" font-weight="700" fill="#64748B" text-anchor="end">cost: almost nothing</text>
<text x="84.0" y="546.0" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start">tests · type checks · linters · schema validation · word counts · exact match</text>
<text x="84.0" y="582.0" font-size="18" font-weight="400" fill="#334155" text-anchor="start" font-style="italic">Nearly free, strict, never drifts. Blind to anything it wasn't built to see.</text>
<rect x="300.0" y="312.0" width="840.0" height="142.0" rx="16" fill="#DDF3EC" stroke="#009E73" stroke-width="3"/>
<text x="324.0" y="352.0" font-size="24" font-weight="800" fill="#00795A" text-anchor="start">2 · MODEL JUDGE</text>
<text x="1116.0" y="352.0" font-size="18" font-weight="700" fill="#64748B" text-anchor="end">cost: tokens per check</text>
<text x="324.0" y="388.0" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start">an anchored rubric, separate instructions, ideally a different model</text>
<text x="324.0" y="424.0" font-size="18" font-weight="400" fill="#334155" text-anchor="start" font-style="italic">Judges meaning and tone. Needs calibration; favors long answers.</text>
<rect x="540.0" y="154.0" width="600.0" height="142.0" rx="16" fill="#F6E6EF" stroke="#CC79A7" stroke-width="3"/>
<text x="564.0" y="194.0" font-size="24" font-weight="800" fill="#9C3F76" text-anchor="start">3 · HUMAN</text>
<text x="1116.0" y="194.0" font-size="18" font-weight="700" fill="#64748B" text-anchor="end">cost: your time</text>
<text x="564.0" y="230.0" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start">a sample of passes, and every escalation</text>
<text x="564.0" y="266.0" font-size="18" font-weight="400" fill="#334155" text-anchor="start" font-style="italic">The final say on stakes and meaning. Slowest.</text>
<path d="M160.0,440.0 L160.0,250.0 L500.0,250.0" fill="none" stroke="#64748B" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
<text x="84.0" y="196.0" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">more flexible,</text>
<text x="84.0" y="218.0" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">more expensive</text>
</svg>
