<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">FIG-5.2: The eval loop: improving a loop is a loop</title>
<desc id="d">A four-step cycle. One: change one thing, such as the prompt, the checker, a cap, or the model. Two: run the golden set, about ten fixed tasks with known answers. Three: compare success rate, iterations per success, cost per success, and false passes against the last version. Four: decide. If the numbers are better and nothing got worse, keep it, bump the version, and write a changelog line; otherwise revert. An arrow returns to step one.</desc>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="ah-body" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CC79A7"/></marker><marker id="ah-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56B4E9"/></marker></defs>
<rect x="6" y="6" width="1188" height="663" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="44.0" y="62.0" font-size="32" font-weight="700" fill="#0F172A" text-anchor="start">The eval loop: improving a loop is a loop</text>
<text x="1156.0" y="58.0" font-size="18" font-weight="600" fill="#64748B" text-anchor="end">FIG-5.2</text>
<rect x="90.0" y="130.0" width="420.0" height="170.0" rx="14" fill="#E1EEF8" stroke="#0072B2" stroke-width="2.5"/>
<text x="300.0" y="195.1" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">1 · CHANGE ONE THING</text>
<text x="300.0" y="222.7" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">the prompt · the checker · a cap · the</text>
<text x="300.0" y="247.4" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">model</text>
<rect x="690.0" y="130.0" width="420.0" height="170.0" rx="14" fill="#E4F3FC" stroke="#56B4E9" stroke-width="2.5"/>
<text x="900.0" y="195.1" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">2 · RUN THE GOLDEN SET</text>
<text x="900.0" y="222.7" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">about 10 fixed tasks with known</text>
<text x="900.0" y="247.4" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">answers</text>
<rect x="690.0" y="400.0" width="420.0" height="170.0" rx="14" fill="#DDF3EC" stroke="#009E73" stroke-width="2.5"/>
<text x="900.0" y="465.1" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">3 · COMPARE</text>
<text x="900.0" y="492.7" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">success rate · iterations per success</text>
<text x="900.0" y="517.4" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">· cost per success · false passes</text>
<rect x="90.0" y="400.0" width="420.0" height="170.0" rx="14" fill="#FDF1D8" stroke="#E69F00" stroke-width="2.5"/>
<text x="300.0" y="452.8" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">4 · KEEP OR REVERT</text>
<text x="300.0" y="480.3" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">better, and nothing worse → keep: bump</text>
<text x="300.0" y="505.0" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">the version + changelog. Otherwise →</text>
<text x="300.0" y="529.7" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">revert.</text>
<path d="M514.0,215.0 L682.0,215.0" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-body)"/>
<path d="M900.0,304.0 L900.0,392.0" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-body)"/>
<path d="M686.0,485.0 L518.0,485.0" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-body)"/>
<path d="M300.0,396.0 L300.0,308.0" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-body)"/>
<circle cx="600.0" cy="350.0" r="70.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="600.0" y="344.0" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">the outer</text>
<text x="600.0" y="370.0" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">loop</text>
<text x="600.0" y="630.0" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">"Revert" is a healthy result: most changes don't help, and the eval tells you before you ship them.</text>
</svg>
