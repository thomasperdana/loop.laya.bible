<text x="654.0" y="368.0" font-size="20" font-weight="800" fill="#00795A" text-anchor="start">MIDDLE</text>
<text x="760.0" y="368.0" font-size="17" font-weight="600" fill="#334155" text-anchor="start">hours</text>
<text x="950.0" y="354.0" font-size="17" font-weight="400" fill="#0F172A" text-anchor="start">CI, a reviewer, your</text>
