<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">FIG-6.1: Loops of loops</title>
<desc id="d">Three concentric rings on the left. Inner loop: the agent's turns, seconds to minutes, checked by tests and linters. Middle loop: one task or pull request, hours, checked by CI and a reviewer. Outer loop: evals and improvements to prompts, checkers, and caps, days to weeks, checked by the golden set and by you. A table on the right repeats each ring's clock and checker.</desc>
