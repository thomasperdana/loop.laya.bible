<text x="346.0" y="502.8" font-size="16" font-weight="400" fill="#334155" text-anchor="start">hourly</text>
<rect x="604.0" y="110.0" width="262.0" height="64.0" rx="12" fill="#DDF3EC" stroke="#009E73" stroke-width="2.5"/>
