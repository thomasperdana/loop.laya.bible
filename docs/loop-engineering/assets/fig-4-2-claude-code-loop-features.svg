<rect x="330.0" y="186.0" width="262.0" height="108.0" rx="12" fill="#FFFFFF" stroke="#56B4E9" stroke-width="2"/>
<text x="346.0" y="218.0" font-size="19" font-weight="800" fill="#0F172A" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/loop [interval]</text>
<text x="346.0" y="246.0" font-size="16" font-weight="400" fill="#334155" text-anchor="start">fixed or self-paced;</text>
