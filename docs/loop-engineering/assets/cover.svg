<rect x="6" y="6" width="1188" height="663" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="70.0" y="232.0" font-size="76" font-weight="800" fill="#0F172A" text-anchor="start">LOOP</text>
<text x="70.0" y="312.0" font-size="76" font-weight="800" fill="#0F172A" text-anchor="start">ENGINEERING</text>
<text x="72.0" y="368.0" font-size="36" font-weight="600" fill="#0072B2" text-anchor="start">From zero to hero</text>
<text x="72.0" y="430.0" font-size="22" font-weight="400" fill="#334155" text-anchor="start">Design the systems that prompt AI agents for you,</text>
<text x="72.0" y="462.0" font-size="22" font-weight="400" fill="#334155" text-anchor="start">with checks you can trust, stop rules a machine</text>
<text x="72.0" y="494.0" font-size="22" font-weight="400" fill="#334155" text-anchor="start">can verify, and budgets you set.</text>
<text x="72.0" y="612.0" font-size="18" font-weight="600" fill="#64748B" text-anchor="start">A LOOP-FORGE guide · 2026</text>
