<title id="t">Cover of the guide Loop Engineering: From Zero to Hero</title>
<desc id="d">Cover of the guide Loop Engineering: From Zero to Hero. On the left, the title. On the right, a ring of six stages, trigger, plan, act, observe, verify, decide, joined by clockwise arrows, with state written down in the middle.</desc>
