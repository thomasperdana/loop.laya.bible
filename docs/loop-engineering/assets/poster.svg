<text x="44.0" y="96.0" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">The core cycle · the five stop families · the nine boxes · the autonomy ladder · the four calculators</text>
<text x="60.0" y="150.0" font-size="20" font-weight="800" fill="#64748B" text-anchor="start">THE CORE CYCLE</text>
