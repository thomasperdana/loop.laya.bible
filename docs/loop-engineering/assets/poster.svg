<rect x="244.0" y="175.0" width="112.0" height="40.0" rx="20" fill="#F6E6EF" stroke="#CC79A7" stroke-width="2.5"/>
<text x="300.0" y="202.0" font-size="18" font-weight="800" fill="#9C3F76" text-anchor="middle">TRIGGER</text>
<rect x="391.9" y="250.0" width="76.0" height="40.0" rx="20" fill="#E1EEF8" stroke="#0072B2" stroke-width="2.5"/>
<text x="429.9" y="277.0" font-size="18" font-weight="800" fill="#005F94" text-anchor="middle">PLAN</text>
