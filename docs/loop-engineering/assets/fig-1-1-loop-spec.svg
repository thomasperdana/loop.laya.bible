<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">FIG-1.1: The Loop Spec: nine boxes on one page</title>
<desc id="d">A header strip with name, version, owner, autonomy rung, and risk level. Below, nine boxes in three rows. Row one: goal, done when, trigger. Row two: actor, context, checker. Row three: state, limits, escalation. Each box has a one-line question.</desc>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="ah-body" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CC79A7"/></marker><marker id="ah-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56B4E9"/></marker></defs>
<rect x="6" y="6" width="1188" height="663" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="44.0" y="62.0" font-size="32" font-weight="700" fill="#0F172A" text-anchor="start">The Loop Spec: nine boxes on one page</text>
<text x="1156.0" y="58.0" font-size="18" font-weight="600" fill="#64748B" text-anchor="end">FIG-1.1</text>
<rect x="60.0" y="104.0" width="1080.0" height="50.0" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
<text x="168.0" y="136.0" font-size="18" font-weight="800" fill="#64748B" text-anchor="middle">NAME</text>
<text x="384.0" y="136.0" font-size="18" font-weight="800" fill="#64748B" text-anchor="middle">VERSION</text>
<line x1="276.0" y1="112.0" x2="276.0" y2="146.0" stroke="#CBD5E1" stroke-width="2"/>
<text x="600.0" y="136.0" font-size="18" font-weight="800" fill="#64748B" text-anchor="middle">OWNER</text>
<line x1="492.0" y1="112.0" x2="492.0" y2="146.0" stroke="#CBD5E1" stroke-width="2"/>
<text x="816.0" y="136.0" font-size="18" font-weight="800" fill="#64748B" text-anchor="middle">AUTONOMY RUNG</text>
<line x1="708.0" y1="112.0" x2="708.0" y2="146.0" stroke="#CBD5E1" stroke-width="2"/>
<text x="1032.0" y="136.0" font-size="18" font-weight="800" fill="#64748B" text-anchor="middle">RISK LEVEL</text>
<line x1="924.0" y1="112.0" x2="924.0" y2="146.0" stroke="#CBD5E1" stroke-width="2"/>
<rect x="60.0" y="172.0" width="352.0" height="150.0" rx="14" fill="#E1EEF8" stroke="#0072B2" stroke-width="2.5"/>
<text x="236.0" y="239.8" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">1 · GOAL</text>
<text x="236.0" y="267.4" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">What end state are we after?</text>
<rect x="424.0" y="172.0" width="352.0" height="150.0" rx="14" fill="#E1EEF8" stroke="#0072B2" stroke-width="2.5"/>
<text x="600.0" y="227.5" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">2 · DONE WHEN</text>
<text x="600.0" y="255.0" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">How can a machine tell it's</text>
<text x="600.0" y="279.7" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">reached?</text>
<rect x="788.0" y="172.0" width="352.0" height="150.0" rx="14" fill="#F6E6EF" stroke="#CC79A7" stroke-width="2.5"/>
<text x="964.0" y="227.5" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">3 · TRIGGER</text>
<text x="964.0" y="255.0" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">You, a schedule, an event, or a</text>
<text x="964.0" y="279.7" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">goal?</text>
<rect x="60.0" y="336.0" width="352.0" height="150.0" rx="14" fill="#E4F3FC" stroke="#56B4E9" stroke-width="2.5"/>
<text x="236.0" y="403.8" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">4 · ACTOR</text>
<text x="236.0" y="431.4" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">Which agent, model, and tools?</text>
<rect x="424.0" y="336.0" width="352.0" height="150.0" rx="14" fill="#E4F3FC" stroke="#56B4E9" stroke-width="2.5"/>
<text x="600.0" y="403.8" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">5 · CONTEXT</text>
<text x="600.0" y="431.4" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">What does each run read first?</text>
<rect x="788.0" y="336.0" width="352.0" height="150.0" rx="14" fill="#DDF3EC" stroke="#009E73" stroke-width="2.5"/>
<text x="964.0" y="403.8" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">6 · CHECKER</text>
<text x="964.0" y="431.4" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">Who checks? Default: not yet</text>
<rect x="60.0" y="500.0" width="352.0" height="150.0" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5"/>
<text x="236.0" y="555.5" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">7 · STATE</text>
<text x="236.0" y="583.0" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">What's written down between</text>
<text x="236.0" y="607.7" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">runs?</text>
<rect x="424.0" y="500.0" width="352.0" height="150.0" rx="14" fill="#FDF1D8" stroke="#E69F00" stroke-width="2.5"/>
<text x="600.0" y="555.5" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">8 · LIMITS</text>
<text x="600.0" y="583.0" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">Caps, stuck, danger: the</text>
<text x="600.0" y="607.7" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">failure exits</text>
<rect x="788.0" y="500.0" width="352.0" height="150.0" rx="14" fill="#FBE6D9" stroke="#D55E00" stroke-width="2.5"/>
<text x="964.0" y="555.5" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">9 · ESCALATION</text>
<text x="964.0" y="583.0" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">Who's called, with what</text>
<text x="964.0" y="607.7" font-size="19" font-weight="400" fill="#334155" text-anchor="middle">evidence?</text>
</svg>
