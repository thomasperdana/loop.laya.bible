<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">FIG-5.1: Failure-mode gallery</title>
<desc id="d">Nine cards, each with a small sketch, a symptom, and a fix. Runaway: iterations and cost keep climbing; fix with caps and a stuck rule. Thrashing: fixing A breaks B and back; fix with smaller turns. Drift: solves a neighboring problem; fix by keeping the goal word for word. Gaming the check: passes with weakened tests; protect the checker. Premature done: says done but spot checks fail; let evidence decide. Context rot: quality fades as a session grows; fresh context plus files. Stale state: redoes finished work; read first, write last. Silent failure: all green but nothing ran; alert when there are no rows. Pile-up: scheduled runs overlap; use a lock file.</desc>
