<text x="1000.0" y="173.0" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">95%</text>
<line x1="170.0" y1="278.0" x2="990.0" y2="278.0" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1000.0" y="284.0" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">80%</text>
