<text x="580.0" y="566.0" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">False-pass rate F (share of wrong work the checker passes)</text>
<text x="92.0" y="315.0" font-size="20" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90 92.0 315.0)">Trust (share of passes that are real)</text>
