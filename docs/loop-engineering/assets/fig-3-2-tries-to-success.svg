<title id="t">FIG-3.2: Chance of success within n tries</title>
<desc id="d">Line chart. Horizontal axis: tries allowed, n, from 1 to 15. Vertical axis: chance of success within n tries, from 0 to 100 percent. Three curves: p = 0.8 passes 99 percent by 3 tries; p = 0.5 reaches 96.9 percent at 5 tries; p = 0.2 climbs slowly, reaching 91.4 percent at 11 tries. Dashed lines at 90 and 95 percent.</desc>
