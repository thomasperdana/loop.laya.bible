<text x="782.0" y="504.0" font-size="18" font-weight="600" fill="#334155" text-anchor="start">= (20,000 × $4 + 2,000 × $20)</text>
<text x="782.0" y="530.0" font-size="18" font-weight="600" fill="#334155" text-anchor="start">   ÷ 1,000,000 = $0.12</text>
<text x="160.0" y="630.0" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start">The cap turns an open-ended risk into a number you can read before you press go.</text>
