<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">FIG-1.3: Four ways a loop starts</title>
<desc id="d">Four cards from left to right. By hand: you start each run, turn-based. On a goal: keep going until a condition holds, goal-based, using /goal. On a schedule: every few minutes, hours, or days, time-based, using /loop, desktop scheduled tasks, or cloud routines. On an event: a push, a failed check, or a new issue, proactive, using routines or CI. An arrow along the bottom shows you watch less as you move right, so checks and limits must get stronger.</desc>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="ah-body" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CC79A7"/></marker><marker id="ah-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56B4E9"/></marker></defs>
<rect x="6" y="6" width="1188" height="663" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="44.0" y="62.0" font-size="32" font-weight="700" fill="#0F172A" text-anchor="start">Four ways a loop starts</text>
<text x="44.0" y="96.0" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">Anthropic's names for each loop type in italics · tool names ⚠VERIFY</text>
<text x="1156.0" y="58.0" font-size="18" font-weight="600" fill="#64748B" text-anchor="end">FIG-1.3</text>
<rect x="60.0" y="130.0" width="256.0" height="380.0" rx="18" fill="#F6E6EF" stroke="#CC79A7" stroke-width="3"/>
<text x="188.0" y="176.0" font-size="22" font-weight="800" fill="#9C3F76" text-anchor="middle">BY HAND</text>
<text x="188.0" y="210.0" font-size="20" font-weight="600" fill="#334155" text-anchor="middle" font-style="italic">Turn-based</text>
<line x1="84.0" y1="232.0" x2="292.0" y2="232.0" stroke="#CC79A7" stroke-width="2"/>
<text x="82.0" y="270.0" font-size="20" font-weight="400" fill="#0F172A" text-anchor="start">You start each run</text>
<text x="82.0" y="296.0" font-size="20" font-weight="400" fill="#0F172A" text-anchor="start">with a prompt</text>
<text x="82.0" y="372.0" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">In Claude Code:</text>
<text x="82.0" y="400.0" font-size="18" font-weight="400" fill="#334155" text-anchor="start">a normal prompt</text>
<rect x="332.0" y="130.0" width="256.0" height="380.0" rx="18" fill="#E1EEF8" stroke="#0072B2" stroke-width="3"/>
<text x="460.0" y="176.0" font-size="22" font-weight="800" fill="#005F94" text-anchor="middle">ON A GOAL</text>
<text x="460.0" y="210.0" font-size="20" font-weight="600" fill="#334155" text-anchor="middle" font-style="italic">Goal-based</text>
<line x1="356.0" y1="232.0" x2="564.0" y2="232.0" stroke="#0072B2" stroke-width="2"/>
<text x="354.0" y="270.0" font-size="20" font-weight="400" fill="#0F172A" text-anchor="start">Keep going until a</text>
<text x="354.0" y="296.0" font-size="20" font-weight="400" fill="#0F172A" text-anchor="start">condition holds</text>
<text x="354.0" y="372.0" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">In Claude Code:</text>
<text x="354.0" y="400.0" font-size="18" font-weight="400" fill="#334155" text-anchor="start">/goal &lt;condition&gt;</text>
<rect x="604.0" y="130.0" width="256.0" height="380.0" rx="18" fill="#E4F3FC" stroke="#56B4E9" stroke-width="3"/>
<text x="732.0" y="176.0" font-size="22" font-weight="800" fill="#1B6FA0" text-anchor="middle">ON A SCHEDULE</text>
<text x="732.0" y="210.0" font-size="20" font-weight="600" fill="#334155" text-anchor="middle" font-style="italic">Time-based</text>
<line x1="628.0" y1="232.0" x2="836.0" y2="232.0" stroke="#56B4E9" stroke-width="2"/>
<text x="626.0" y="270.0" font-size="20" font-weight="400" fill="#0F172A" text-anchor="start">Every few minutes,</text>
<text x="626.0" y="296.0" font-size="20" font-weight="400" fill="#0F172A" text-anchor="start">hours, or days</text>
<text x="626.0" y="372.0" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">In Claude Code:</text>
<text x="626.0" y="400.0" font-size="18" font-weight="400" fill="#334155" text-anchor="start">/loop · desktop tasks</text>
<text x="626.0" y="423.4" font-size="18" font-weight="400" fill="#334155" text-anchor="start">· cloud routines</text>
<rect x="876.0" y="130.0" width="256.0" height="380.0" rx="18" fill="#DDF3EC" stroke="#009E73" stroke-width="3"/>
<text x="1004.0" y="176.0" font-size="22" font-weight="800" fill="#00795A" text-anchor="middle">ON AN EVENT</text>
<text x="1004.0" y="210.0" font-size="20" font-weight="600" fill="#334155" text-anchor="middle" font-style="italic">Proactive</text>
<line x1="900.0" y1="232.0" x2="1108.0" y2="232.0" stroke="#009E73" stroke-width="2"/>
<text x="898.0" y="270.0" font-size="20" font-weight="400" fill="#0F172A" text-anchor="start">A push, a failed</text>
<text x="898.0" y="296.0" font-size="20" font-weight="400" fill="#0F172A" text-anchor="start">check, a new issue</text>
<text x="898.0" y="372.0" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">In Claude Code:</text>
<text x="898.0" y="400.0" font-size="18" font-weight="400" fill="#334155" text-anchor="start">routines on API or</text>
<text x="898.0" y="423.4" font-size="18" font-weight="400" fill="#334155" text-anchor="start">GitHub events · CI</text>
<path d="M80.0,568.0 L1120.0,568.0" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round" marker-end="url(#ah-body)"/>
<text x="80.0" y="606.0" font-size="18" font-weight="700" fill="#64748B" text-anchor="start">You watch every run</text>
<text x="1120.0" y="606.0" font-size="18" font-weight="700" fill="#B34D00" text-anchor="end">Nobody watches: stronger checks and stricter limits</text>
</svg>
