<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">FIG-3.3: Fresh context, memory in files</title>
<desc id="d">Three runs side by side. Each starts with a fresh context, reads PROMPT.md, progress.md, and the recent git log, finishes one item, then writes progress.md, a commit, and a run-log row. Below, a band of files on disk persists across runs: PROMPT.md is the same every run; progress.md is updated; git history grows; the run log grows. A note at the right says one long session instead fills up, gets compacted, and blurs early details.</desc>
