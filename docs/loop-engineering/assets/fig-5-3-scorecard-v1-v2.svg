<title id="t">FIG-5.3: CS-1 scorecard: v1 vs v2</title>
<desc id="d">Paired horizontal bars for eight criteria rated 0 to 5. Version 1 in orange with diagonal hatching, version 2 in solid blue. Goal and done: 2 then 5. Checker: 1 then 5. Stop rules and budget: 0 then 5. Safety: 1 then 4. State and memory: 1 then 4. Observability: 1 then 4. Human touchpoints: 1 then 4. Reusability: 1 then 4. Totals: 20 out of 100 for v1 and 89 out of 100 for v2.</desc>
